[package]
name = "engine-jni"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
automation-core = { path = "../automation-core" }
coordinate = { path = "../coordinate" }
engine-core = { path = "../engine-core" }
flow-compiler = { path = "../../../tools/flow-compiler" }
flow-ir = { path = "../flow-ir" }
jni = { workspace = true }
lua-runtime = { path = "../lua-runtime" }
root-client = { path = "../root-client" }
runtime-executor = { path = "../runtime-executor" }
runtime-scheduler = { path = "../runtime-scheduler" }
serde = { workspace = true }
serde_json = { workspace = true }

[dev-dependencies]
glyph-ocr = { path = "../glyph-ocr" }

[lints.rust]
unsafe_code = "allow"

[lints.clippy]
all = "warn"
pedantic = "warn"
