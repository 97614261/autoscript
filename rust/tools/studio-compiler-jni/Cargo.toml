[package]
name = "studio-compiler-jni"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
flow-compiler = { path = "../flow-compiler" }
flow-ir = { path = "../../crates/flow-ir" }
release-packager = { path = "../release-packager" }
jni = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }

[dev-dependencies]
automation-core = { path = "../../crates/automation-core" }
engine-core = { path = "../../crates/engine-core" }
glyph-ocr = { path = "../../crates/glyph-ocr" }
lua-runtime = { path = "../../crates/lua-runtime" }
runtime-executor = { path = "../../crates/runtime-executor" }
runtime-scheduler = { path = "../../crates/runtime-scheduler" }

[lints.rust]
unsafe_code = "allow"

[lints.clippy]
all = "warn"
pedantic = "warn"
