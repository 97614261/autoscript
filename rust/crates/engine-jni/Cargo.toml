[package]
name = "engine-jni"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
automation-core = { path = "../automation-core" }
coordinate = { path = "../coordinate" }
engine-core = { path = "../engine-core" }
glyph-ocr = { path = "../glyph-ocr" }
jni = { workspace = true }
lua-runtime = { path = "../lua-runtime" }
pixel-vision = { path = "../pixel-vision" }
root-client = { path = "../root-client" }
root-protocol = { path = "../root-protocol" }
runtime-executor = { path = "../runtime-executor" }
runtime-scheduler = { path = "../runtime-scheduler" }
serde = { workspace = true }
serde_json = { workspace = true }

[target.'cfg(target_os = "android")'.dependencies]
libc = "0.2.189"

[lints.rust]
unsafe_code = "allow"

[lints.clippy]
all = "warn"
pedantic = "warn"
