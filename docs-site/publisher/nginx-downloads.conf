# Add inside the existing site server {} after preserving its original config.
# Do not expose port 8765 or the retired /api/admin/ path.
# Signed publishing uses the separate nginx-publish.conf snippet.
location = /downloads/release.json {
    alias /var/lib/zhigou-publisher/downloads/release.json;
    default_type application/json;
    add_header Cache-Control "no-store" always;
    add_header X-Content-Type-Options "nosniff" always;
}
location ^~ /downloads/ {
    alias /var/lib/zhigou-publisher/downloads/;
    autoindex off;
    types {
        application/vnd.android.package-archive apk;
        text/plain sha256;
    }
    default_type application/octet-stream;
    add_header Content-Disposition "attachment";
    add_header Cache-Control "public, max-age=31536000, immutable";
    add_header X-Content-Type-Options "nosniff" always;
}
