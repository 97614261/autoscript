name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  r0-gate:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.96.0
          components: rustfmt, clippy
          targets: aarch64-linux-android,x86_64-linux-android

      - uses: Swatinem/rust-cache@v2

      - name: Install Android SDK packages
        shell: pwsh
        run: |
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;30.0.14904198"
          "sdk.dir=$($env:ANDROID_SDK_ROOT.Replace('\', '\\'))" | Set-Content -Encoding ASCII local.properties

      - name: Rust quality gates
        shell: pwsh
        run: |
          cargo fmt --all --check
          cargo clippy --workspace --all-targets -- -D warnings
          cargo test --workspace

      - name: Contract and generated-output gates
        shell: pwsh
        run: |
          cargo run -p schema-check -- .
          cargo run -p api-codegen -- check .

      - name: Android debug packages and lint
        shell: pwsh
        run: |
          ./gradlew.bat :apps:studio-android:assembleDebug :apps:runner-template-android:assembleDebug :apps:studio-android:lintDebug :apps:runner-template-android:lintDebug --no-daemon

      - name: Runner package invariants
        shell: pwsh
        run: cargo run -p package-probe -- apps/runner-template-android/build/outputs/apk/debug/runner-template-android-debug.apk
