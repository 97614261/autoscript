name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  documentation:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: docs-site
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: docs-site/package-lock.json
      - run: npm ci
      - run: npm test
      - run: python3 scripts/deploy-static.test.py
      - run: python3 scripts/update-static.test.py
      - run: python3 scripts/publish-server.test.py
      - run: python3 scripts/update-publisher.test.py
      - run: npm run build

  r0-gate:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.96.0
          components: rustfmt, clippy
          targets: aarch64-linux-android,x86_64-linux-android

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "rust -> target"

      - name: Install Android SDK packages
        shell: pwsh
        run: |
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;30.0.14904198"
          "sdk.dir=$($env:ANDROID_SDK_ROOT.Replace('\', '\\'))" | Set-Content -Encoding ASCII android/local.properties

      - name: Rust quality gates
        shell: pwsh
        run: |
          ./scripts/check-rust.ps1

      - name: Repository layout and documentation links
        shell: pwsh
        run: |
          ./scripts/check-repository-layout.ps1
          if ($LASTEXITCODE -ne 0) { throw "Repository layout gate failed" }
          ./scripts/apk-output-recovery-test.ps1
          if ($LASTEXITCODE -ne 0) { throw "APK recovery gate failed" }
          python scripts/apk-size-report-test.py
          if ($LASTEXITCODE -ne 0) { throw "APK size/inventory gate failed" }
          ./scripts/distribution-signature-test.ps1
          if ($LASTEXITCODE -ne 0) { throw "Distribution signature format gate failed" }

      - name: Android debug packages and lint
        shell: pwsh
        run: |
          ./gradlew.bat :apps:studio-android:testDebugUnitTest :android:brand-ui:testDebugUnitTest :apps:runner-template-android:testDebugUnitTest :android:script-ui:testDebugUnitTest :android:project-store:testDebugUnitTest :android:runtime-client:testDebugUnitTest :android:runtime-service:testDebugUnitTest :android:vision-spi:testDebugUnitTest :android:vision-components:testDebugUnitTest :apps:studio-android:assembleDebug :apps:runner-template-android:assembleDebug :apps:studio-android:lintDebug :apps:runner-template-android:lintDebug --no-daemon
          if ($LASTEXITCODE -ne 0) { throw "Android gate failed" }

      - name: Runner package invariants
        working-directory: rust
        shell: pwsh
        run: cargo run -p package-probe -- ../android/apps/runner-template-android/build/outputs/apk/debug/runner-template-android-debug.apk
