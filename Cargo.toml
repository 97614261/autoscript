[workspace]
resolver = "2"
members = [
    "engine/crates/automation-core",
    "engine/crates/coordinate",
    "engine/crates/engine-core",
    "engine/crates/engine-jni",
    "engine/crates/flow-ir",
    "engine/crates/glyph-ocr",
    "engine/crates/lua-runtime",
    "engine/crates/pixel-vision",
    "engine/crates/root-protocol",
    "engine/crates/root-client",
    "engine/crates/root-daemon-core",
    "engine/crates/root-daemon",
    "engine/crates/runtime-scheduler",
    "engine/crates/runtime-executor",
    "engine/crates/script-api",
    "tools/api-codegen",
    "tools/flow-compiler",
    "tools/studio-compiler-jni",
    "tools/glyph-maker",
    "tools/schema-check",
    "tools/package-probe",
    "tools/release-packager",
]

[workspace.package]
edition = "2021"
rust-version = "1.96"

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
all = "warn"
pedantic = "warn"

[workspace.dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.10.9"
mlua = { version = "0.12.1", default-features = false, features = ["lua54", "vendored"] }
fs4 = { version = "1.1.0", default-features = false, features = ["sync"] }
jni = { version = "0.21.1", default-features = false }
